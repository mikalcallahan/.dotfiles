# Set prefix keys
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Reload config file 
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Use vi mode
setw -g mode-keys vi
set-option -g extended-keys on
set -g extended-keys-format csi-u
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Toggle rectangle selection" -T copy-mode-vi V send -X rectangle-toggle
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane controls
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind-key -N "Focus pane left" -n C-M-h select-pane -L
bind-key -N "Focus pane right" -n C-M-l select-pane -R
bind-key -N "Focus pane up" -n C-M-k select-pane -U
bind-key -N "Focus pane down" -n C-M-j select-pane -D

# Attempt to toggle (hide/show) pane (not working)
# Hide the current pane and send it to a window named "hidden-window"
# bind H break-pane -d -n "hidden-window"
# Show the pane back from "hidden-window"
# bind V join-pane -t "hidden-window"
# bind T if-shell "list-windows | grep -q 'hidden-window'" \
#     "join-pane -t 'hidden-window'" \
#     "break-pane -d -n 'hidden-window'"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -N "Navigate left across Vim and tmux panes" -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -N "Navigate down across Vim and tmux panes" -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -N "Navigate up across Vim and tmux panes" -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -N "Navigate right across Vim and tmux panes" -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -N 'Navigate to last Vim or tmux pane' -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -N 'Navigate to last Vim or tmux pane' -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -N "Focus pane left" -T copy-mode-vi 'C-h' select-pane -L
bind-key -N "Focus pane down" -T copy-mode-vi 'C-j' select-pane -D
bind-key -N "Focus pane up" -T copy-mode-vi 'C-k' select-pane -U
bind-key -N "Focus pane right" -T copy-mode-vi 'C-l' select-pane -R
bind-key -N "Focus last pane" -T copy-mode-vi 'C-\' select-pane -l

bind-key -N "Resize pane left" -n C-M-Left resize-pane -L 5
bind-key -N "Resize pane right" -n C-M-Right resize-pane -R 5
bind-key -N "Resize pane up" -n C-M-Up resize-pane -U 5
bind-key -N "Resize pane down" -n C-M-Down resize-pane -D 5

bind-key -N "Swap with the next pane" L swap-pane -D
bind-key -N "Swap with the previous pane" H swap-pane -U

bind -N "Kill pane" k kill-pane
bind -N "Kill pane" -n C-PageDown kill-pane
bind -N "Kill pane" -n C-M-PageDown kill-pane
bind -N "Kill pane" -n C-M-Delete kill-pane


# Window controls
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" x kill-window
bind -N "Kill window" K kill-window
bind-key -N "Previous window" -n S-Left previous-window
bind-key -N "Next window" -n S-Right next-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

# Sessions controls
bind -N "Create session" C new-session
bind -N "Kill session" X kill-session
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Previous session" p switch-client -p
bind -N "Next session" n switch-client -n
bind -N "Choose session" s choose-session -Z

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -ag terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q' # fix cursor on vim normal/insert
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
bind-key -N "Toggle status bar" -n S-Up set-option -g status
bind-key -N "Toggle status bar" -n S-Down set-option -g status


# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]"
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
set -g clock-mode-colour blue
set -g pane-border-lines double
